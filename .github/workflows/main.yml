name: Build ToonAI Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: toonai_studio
        run: flutter pub get

      - name: Build APK
        working-directory: toonai_studio
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToonAI-Studio-APK
          path: toonai_studio/build/app/outputs/flutter-apk/app-release.apk
